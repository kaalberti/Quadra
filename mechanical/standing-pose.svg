<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="800" viewBox="0 0 1360 800" role="img" aria-labelledby="title description">
  <title id="title">KIN-003 nominal standing pose: 120 mm hip height</title>
  <desc id="description">Left-side view of the front-left bent leg and top view of four nominal feet. Geometry checked; physical standing, ground clearance and servo adequacy unverified.</desc>
  <defs>
    <marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto-start-reverse"><path d="M0,0 L6,3 L0,6" fill="none" stroke="#475569"/></marker>
    <style>
      text {font-family:Arial,sans-serif;font-size:16px;fill:#172033}
      .heading {font-size:23px;font-weight:bold}
      .small {font-size:14px}
      .upper {stroke:#0284c7;stroke-width:6;fill:none}
      .lower {stroke:#d97706;stroke-width:6;fill:none}
      .point {fill:white;stroke:#172033;stroke-width:2}
      .datum {stroke:#94a3b8;stroke-width:1;stroke-dasharray:6 5}
      .extension {stroke:#94a3b8;stroke-width:1}
      .dim {stroke:#475569;stroke-width:1;marker-start:url(#arrow);marker-end:url(#arrow)}
      .axis {stroke:#475569;stroke-width:1.5;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1360" height="800" fill="white"/>
  <text x="35" y="38" class="heading">KIN-003 | Nominal geometric standing pose | Dimensions in mm</text>
  <text x="35" y="67">All legs: q1 = 0 deg; q2 = 44.048626 deg; q3 = 78.978550 deg. Physical standing remains unverified.</text>
  <g id="side-view" data-scale="3">
    <text x="95" y="118" class="heading">LEFT SIDE / FL leg / looking -y</text>
    <line class="datum" x1="90" y1="180" x2="650" y2="180"/>
    <text x="92" y="166">J1/J2 datum; z_body = 0</text>
    <line id="side-FL-upper" class="upper" x1="390" y1="180" x2="243.993592285" y2="330.9375"/>
    <line id="side-FL-lower" class="lower" x1="243.993592285" y1="330.9375" x2="390" y2="540"/>
    <line class="datum" x1="390" y1="180" x2="390" y2="540"/>
    <circle id="side-FL-H" class="point" cx="390" cy="180" r="6"/>
    <circle id="side-FL-K" class="point" cx="243.993592285" cy="330.9375" r="6"/>
    <circle id="side-FL-P" class="point" cx="390" cy="540" r="6"/>
    <text x="402" y="204">H / J2 (O overlaps)</text>
    <text x="104" y="336">K / J3</text>
    <text id="label-upper" x="175" y="250" fill="#0284c7">70 mm</text>
    <text id="label-lower" x="235" y="458" fill="#d97706">85 mm</text>
    <line id="ground-line" x1="90" y1="540" x2="650" y2="540" stroke="#475569" stroke-width="2"/>
    <text x="100" y="566">Ideal ground: z_body = -120; z_ground = 0</text>
    <text x="399" y="524">P / foot</text>
    <line class="extension" x1="390" y1="180" x2="590" y2="180"/>
    <line id="dim-height" class="dim" x1="580" y1="180" x2="580" y2="540"/>
    <text id="label-height" x="607" y="405" transform="rotate(-90 607 405)">120 mm datum height</text>
    <line class="extension" x1="243.993592285" y1="330.9375" x2="243.993592285" y2="135"/>
    <line class="extension" x1="390" y1="180" x2="390" y2="135"/>
    <line id="dim-knee-forward" class="dim" x1="243.993592285" y1="140" x2="390" y2="140"/>
    <text id="label-knee-forward" x="407" y="146">48.668803 mm</text>
    <line class="axis" x1="170" y1="610" x2="110" y2="610"/>
    <line class="axis" x1="170" y1="610" x2="170" y2="580"/>
    <text x="80" y="615">+x</text><text x="183" y="594">+z</text><text x="240" y="615">+y out</text>
  </g>
  <g id="top-view" data-scale="2">
    <text x="745" y="118" class="heading">TOP / nominal foot centres</text>
    <rect id="body-plan" x="850" y="165" width="220" height="360" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
    <rect id="foot-rectangle" x="800" y="195" width="320" height="300" fill="none" stroke="#0f766e" stroke-dasharray="6 5"/>
    <circle id="top-FL-P" class="point" cx="800" cy="195" r="6"/>
    <circle id="top-FR-P" class="point" cx="1120" cy="195" r="6"/>
    <circle id="top-RL-P" class="point" cx="800" cy="495" r="6"/>
    <circle id="top-RR-P" class="point" cx="1120" cy="495" r="6"/>
    <text x="762" y="184">FL</text><text x="1132" y="184">FR</text>
    <text x="762" y="520">RL</text><text x="1132" y="520">RR</text>
    <line class="axis" x1="960" y1="345" x2="960" y2="280"/>
    <line class="axis" x1="960" y1="345" x2="895" y2="345"/>
    <text x="974" y="293">+x</text><text x="892" y="372">+y</text><text x="974" y="367">B</text>
    <text x="875" y="438">180 x 110 body</text><text x="890" y="462">planform only</text>
    <line class="extension" x1="800" y1="495" x2="800" y2="587"/>
    <line class="extension" x1="1120" y1="495" x2="1120" y2="587"/>
    <line id="dim-stance-width" class="dim" x1="800" y1="580" x2="1120" y2="580"/>
    <text id="label-stance-width" x="870" y="568">160 mm foot spacing</text>
    <line class="extension" x1="1120" y1="195" x2="1230" y2="195"/>
    <line class="extension" x1="1120" y1="495" x2="1230" y2="495"/>
    <line id="dim-stance-length" class="dim" x1="1220" y1="195" x2="1220" y2="495"/>
    <text id="label-stance-length" x="1246" y="420" transform="rotate(-90 1246 420)">150 mm foot spacing</text>
    <text x="768" y="615">Feet shown; knees and moving envelope omitted.</text>
  </g>
  <line x1="35" y1="652" x2="1325" y2="652" stroke="#cbd5e1"/>
  <text x="35" y="683">FL body coordinates: H (75,80,0); K (123.668803,80,-50.3125); P (75,80,-120).</text>
  <text x="35" y="711">Ground coordinates add (0,0,120). Knee ground height: 69.6875 mm. No chassis thickness is defined.</text>
  <text x="35" y="739">Contact rectangle is not a stability approval. COM, servo torque, joint travel, and physical clearances remain unverified.</text>
  <text x="35" y="773" class="small">Source: standing-pose.json and unchanged KIN-002 skeleton. Views use different scales; dimension labels govern.</text>
</svg>
