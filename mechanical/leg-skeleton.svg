<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title description">
  <title id="title">KIN-002 candidate quadruped skeleton: 180 x 110 body, 70 / 85 links</title>
  <desc id="description">Dimensioned top, front and left-side orthographic views at zero joint angles. Millimetres. Straight reference only, not a standing pose. Physical packaging unverified.</desc>
  <defs>
    <marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto-start-reverse"><path d="M0,0 L6,3 L0,6" fill="none" stroke="#475569"/></marker>
    <style>
      text {font-family:Arial,sans-serif;fill:#172033;font-size:16px}
      .heading {font-size:23px;font-weight:bold}
      .small {font-size:14px}
      .body {fill:#f1f5f9;stroke:#64748b;stroke-width:2}
      .datum {stroke:#94a3b8;stroke-width:1;stroke-dasharray:6 5}
      .offset {stroke:#7c3aed;stroke-width:5;fill:none}
      .upper {stroke:#0284c7;stroke-width:5;fill:none}
      .lower {stroke:#d97706;stroke-width:5;fill:none}
      .point {fill:white;stroke:#172033;stroke-width:2}
      .dim {stroke:#475569;stroke-width:1;marker-start:url(#arrow);marker-end:url(#arrow)}
      .extension {stroke:#94a3b8;stroke-width:1}
      .axis {stroke:#475569;stroke-width:1.5;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1600" height="900" fill="white"/>
  <text x="40" y="38" class="heading">KIN-002 | Candidate centre-line skeleton | All dimensions in mm</text>
  <text x="40" y="66">q1 = q2 = q3 = 0: straight reference only, NOT a standing pose. Servo and bracket clearance unverified.</text>

  <g id="top-view" data-scale="2">
    <text x="220" y="125" class="heading">TOP / all legs</text>
    <rect id="body-plan" class="body" x="210" y="150" width="220" height="360"/>
    <line class="datum" x1="320" y1="140" x2="320" y2="525"/>
    <line class="datum" x1="150" y1="330" x2="490" y2="330"/>
    <line id="top-FL-offset" class="offset" x1="210" y1="180" x2="160" y2="180"/>
    <line id="top-FR-offset" class="offset" x1="430" y1="180" x2="480" y2="180"/>
    <line id="top-RL-offset" class="offset" x1="210" y1="480" x2="160" y2="480"/>
    <line id="top-RR-offset" class="offset" x1="430" y1="480" x2="480" y2="480"/>
    <circle id="top-FL-O" class="point" cx="210" cy="180" r="5"/>
    <circle id="top-FL-H" class="point" cx="160" cy="180" r="5"/>
    <circle id="top-FR-O" class="point" cx="430" cy="180" r="5"/>
    <circle id="top-FR-H" class="point" cx="480" cy="180" r="5"/>
    <circle id="top-RL-O" class="point" cx="210" cy="480" r="5"/>
    <circle id="top-RL-H" class="point" cx="160" cy="480" r="5"/>
    <circle id="top-RR-O" class="point" cx="430" cy="480" r="5"/>
    <circle id="top-RR-H" class="point" cx="480" cy="480" r="5"/>
    <text x="130" y="164">FL</text><text x="470" y="164">FR</text>
    <text x="130" y="505">RL</text><text x="470" y="505">RR</text>
    <text x="218" y="207" class="small">O / J1</text><text x="122" y="218" class="small">H/K/P</text>
    <line class="axis" x1="320" y1="330" x2="320" y2="255"/>
    <line class="axis" x1="320" y1="330" x2="245" y2="330"/>
    <text x="330" y="273">+x</text><text x="245" y="354">+y</text>
    <text x="332" y="352">B; +z out</text>
    <line class="extension" x1="210" y1="150" x2="210" y2="91"/>
    <line class="extension" x1="430" y1="150" x2="430" y2="91"/>
    <line id="dim-body-width" class="dim" x1="210" y1="95" x2="430" y2="95"/>
    <text id="label-body-width" x="281" y="89">110 mm</text>
    <line class="extension" x1="210" y1="150" x2="94" y2="150"/>
    <line class="extension" x1="210" y1="510" x2="94" y2="510"/>
    <line id="dim-body-length" class="dim" x1="100" y1="150" x2="100" y2="510"/>
    <text id="label-body-length" x="83" y="365" transform="rotate(-90 83 365)">180 mm</text>
    <line class="extension" x1="480" y1="180" x2="548" y2="180"/>
    <line class="extension" x1="480" y1="480" x2="548" y2="480"/>
    <line id="dim-root-length" class="dim" x1="540" y1="180" x2="540" y2="480"/>
    <text id="label-root-length" x="563" y="372" transform="rotate(-90 563 372)">150 mm roots</text>
    <line class="extension" x1="430" y1="150" x2="515" y2="150"/>
    <line id="dim-end-inset" class="dim" x1="505" y1="150" x2="505" y2="180"/>
    <text id="label-end-inset" x="525" y="151">15 mm</text>
    <text x="145" y="555">H, K and P coincide in top projection.</text>
    <text x="145" y="579">J1 centres lie on the body side boundaries.</text>
  </g>

  <g id="front-view" data-scale="2">
    <text x="675" y="125" class="heading">FRONT / looking -x</text>
    <line class="datum" x1="610" y1="210" x2="1000" y2="210"/>
    <line class="body" x1="690" y1="210" x2="910" y2="210"/>
    <line id="front-FL-offset" class="offset" x1="910" y1="210" x2="960" y2="210"/>
    <line id="front-FR-offset" class="offset" x1="690" y1="210" x2="640" y2="210"/>
    <line id="front-FL-upper" class="upper" x1="960" y1="210" x2="960" y2="350"/>
    <line id="front-FL-lower" class="lower" x1="960" y1="350" x2="960" y2="520"/>
    <line id="front-FR-upper" class="upper" x1="640" y1="210" x2="640" y2="350"/>
    <line id="front-FR-lower" class="lower" x1="640" y1="350" x2="640" y2="520"/>
    <circle id="front-FL-O" class="point" cx="910" cy="210" r="5"/>
    <circle id="front-FL-H" class="point" cx="960" cy="210" r="5"/>
    <circle id="front-FL-K" class="point" cx="960" cy="350" r="5"/>
    <circle id="front-FL-P" class="point" cx="960" cy="520" r="5"/>
    <circle id="front-FR-O" class="point" cx="690" cy="210" r="5"/>
    <circle id="front-FR-H" class="point" cx="640" cy="210" r="5"/>
    <circle id="front-FR-K" class="point" cx="640" cy="350" r="5"/>
    <circle id="front-FR-P" class="point" cx="640" cy="520" r="5"/>
    <text x="700" y="239" class="small">O / J1</text><text x="617" y="239" class="small">H</text>
    <text x="617" y="347" class="small">K</text><text x="617" y="539" class="small">P</text>
    <text x="747" y="199">z = 0 datum</text>
    <line class="axis" x1="800" y1="340" x2="800" y2="275"/>
    <line class="axis" x1="800" y1="340" x2="865" y2="340"/>
    <text x="813" y="280">+z</text><text x="850" y="365">+y</text>
    <text x="755" y="395">+x out</text>
    <line class="extension" x1="640" y1="210" x2="640" y2="165"/>
    <line class="extension" x1="690" y1="210" x2="690" y2="165"/>
    <line id="dim-offset" class="dim" x1="640" y1="170" x2="690" y2="170"/>
    <text id="label-offset" x="635" y="156">25 mm</text>
    <line class="extension" x1="640" y1="520" x2="640" y2="588"/>
    <line class="extension" x1="960" y1="520" x2="960" y2="588"/>
    <line id="dim-pitch-width" class="dim" x1="640" y1="580" x2="960" y2="580"/>
    <text id="label-pitch-width" x="748" y="569">160 mm</text>
    <text x="665" y="610">Rear legs overlap front legs in this view.</text>
  </g>

  <g id="side-view" data-scale="2">
    <text x="1110" y="125" class="heading">LEFT SIDE / FL only</text>
    <text x="1110" y="151" class="small">Looking -y; O and H overlap</text>
    <line class="datum" x1="1110" y1="210" x2="1500" y2="210"/>
    <line id="side-FL-upper" class="upper" x1="1220" y1="210" x2="1220" y2="350"/>
    <line id="side-FL-lower" class="lower" x1="1220" y1="350" x2="1220" y2="520"/>
    <circle id="side-FL-H" class="point" cx="1220" cy="210" r="5"/>
    <circle id="side-FL-K" class="point" cx="1220" cy="350" r="5"/>
    <circle id="side-FL-P" class="point" cx="1220" cy="520" r="5"/>
    <text x="1110" y="194">O / H: z = 0</text>
    <text x="1110" y="355">K: z = -70</text>
    <text x="1110" y="542">P: z = -155</text>
    <line class="extension" x1="1220" y1="210" x2="1430" y2="210"/>
    <line class="extension" x1="1220" y1="350" x2="1320" y2="350"/>
    <line class="extension" x1="1220" y1="520" x2="1430" y2="520"/>
    <line id="dim-upper" class="dim" x1="1285" y1="210" x2="1285" y2="350"/>
    <text id="label-upper" x="1296" y="282">70 mm</text>
    <line id="dim-lower" class="dim" x1="1285" y1="350" x2="1285" y2="520"/>
    <text id="label-lower" x="1296" y="439">85 mm</text>
    <line id="dim-straight" class="dim" x1="1420" y1="210" x2="1420" y2="520"/>
    <text id="label-straight" x="1445" y="414" transform="rotate(-90 1445 414)">155 mm reference</text>
    <line class="axis" x1="1190" y1="605" x2="1130" y2="605"/>
    <line class="axis" x1="1190" y1="605" x2="1190" y2="560"/>
    <text x="1098" y="610">+x</text><text x="1200" y="575">+z</text>
    <text x="1330" y="610">+y out</text>
  </g>

  <line x1="40" y1="648" x2="1560" y2="648" stroke="#cbd5e1"/>
  <text x="40" y="680" class="heading">Reference centres and signed axes</text>
  <text x="40" y="711">FL: O (75,55,0)   H (75,80,0)   K (75,80,-70)   P (75,80,-155)</text>
  <text x="40" y="738">FR: negate y. Rear: subtract 150 from x. All coordinates in body frame B.</text>
  <text x="40" y="765">Zero-angle axes: J1 = +x left / -x right; J2 = -y; J3 = +y.</text>
  <text x="40" y="792">Body datum is the J1 plane; body thickness and underside height remain undefined.</text>
  <line class="offset" x1="1040" y1="680" x2="1080" y2="680"/><text x="1090" y="686">J1-to-J2 offset carrier</text>
  <line class="upper" x1="1040" y1="713" x2="1080" y2="713"/><text x="1090" y="719">Upper link / 70 mm centres</text>
  <line class="lower" x1="1040" y1="746" x2="1080" y2="746"/><text x="1090" y="752">Lower link / 85 mm to contact</text>
  <text x="1040" y="788">u = w = h = 0; a = 75; b = 55; d = 25.</text>
  <text x="40" y="844">Ideal centre-lines only. No ground plane, servo envelope, printable parts, joint limits, workspace, or torque approval.</text>
  <text x="40" y="873" class="small">Source: leg-skeleton.json and docs/leg-frames.md. Dimension labels govern; screen/print scaling is arbitrary.</text>
</svg>
